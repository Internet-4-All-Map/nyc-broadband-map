<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>NYC City Council Districts – Internet Access</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #fff;
      font-family: system-ui, sans-serif;
    }

    #map {
      position: absolute;
      inset: 0;
      background: #fff;
    }

    #togglePanelBtn {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 11000;
      background: #fff;
      border-radius: 50%;
      width: 46px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 10px rgba(0,0,0,.25);
      cursor: pointer;
      font-size: 22px;
      user-select: none;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="togglePanelBtn" title="Info">i</div>

  <script>
    // point this to your council district GeoJSON file
    const PATH = "data/nyc_council_districts_internet.geojson";
    const FIELD = "no_internet_pct";

    const map = L.map("map", {
      zoomControl: true,
      preferCanvas: true,
      attributionControl: false
    }).setView([40.73, -73.93], 10);

    map.scrollWheelZoom.disable();
    map.doubleClickZoom.disable();
    map.boxZoom.disable();

    L.tileLayer(
      "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
      {
        subdomains: "abcd",
        maxZoom: 20
      }
    ).addTo(map);

    map.createPane("pane-council");
    map.getPane("pane-council").style.zIndex = 410;

    let layer = null;
    let opacity = 0.85;

    function colorNoInternet(p) {
      if (p >= 25) return "#b10026";
      if (p >= 20) return "#e31a1c";
      if (p >= 15) return "#fc4e2a";
      if (p >= 10) return "#fd8d3c";
      if (p >= 5)  return "#feb24c";
      return "#fed976";
    }

    function style(feature) {
      const v = Number(feature.properties?.[FIELD]);
      return {
        pane: "pane-council",
        color: "#444",
        weight: 1,
        fill: true,
        fillOpacity: opacity,
        fillColor: colorNoInternet(v),
        interactive: true
      };
    }

    function formatPct(v) {
      const n = Number(v);
      return Number.isFinite(n) ? n.toFixed(1) : "N/A";
    }

    function districtLabel(props) {
      const district = props.district_num ?? "N/A";
      const borough = props.Borough ?? "";
      return `Council District ${district}${borough ? `, ${borough}` : ""}`;
    }

    fetch(PATH)
      .then(r => r.json())
      .then(fc => {
        layer = L.geoJSON(fc, {
          style,
          onEachFeature: (feature, lyr) => {
            const p = feature.properties || {};

            lyr.on("mouseover", () => {
              lyr.setStyle({
                weight: 2,
                color: "#111"
              });

              if (!L.Browser.ie && !L.Browser.opera && !L.Browser.edge) {
                lyr.bringToFront();
              }
            });

            lyr.on("mouseout", () => {
              lyr.setStyle({
                weight: 1,
                color: "#444"
              });
            });

            lyr.on("click", (e) => {
              const pctTxt = formatPct(p.no_internet_pct);

              L.popup({
                closeButton: true,
                offset: [0, -6],
                maxWidth: 320
              })
              .setLatLng(e.latlng)
              .setContent(`
                <div style="font:14px system-ui,sans-serif; line-height:1.35;">
                  <div style="font-weight:700; margin-bottom:6px;">
                    ${districtLabel(p)}
                  </div>

                  <div style="margin-bottom:6px;">
                    <strong>Member:</strong> ${p.Member ?? "N/A"}
                  </div>

                  <div style="margin-bottom:6px;">
                    <strong>Party:</strong> ${p.Party ?? "N/A"}
                  </div>

                  <div style="margin-bottom:6px;">
                    <strong>No internet:</strong> ${pctTxt}%
                  </div>

                  <div style="margin-bottom:6px;">
                    <strong>Tier:</strong> ${p.no_internet_tier ?? "N/A"}
                  </div>

                  <div style="margin-top:8px; font-size:12px; color:#666;">
                    ${p._internet_source ?? ""}
                  </div>
                </div>
              `)
              .openOn(map);
            });
          }
        }).addTo(map);

        map.fitBounds(layer.getBounds(), { padding: [20, 20] });
      })
      .catch(err => {
        console.error("Failed to load GeoJSON:", err);
      });

    document.getElementById("togglePanelBtn").addEventListener("click", () => {
      L.popup({ closeButton: true, offset: [0, -6] })
        .setLatLng(map.getCenter())
        .setContent(`
          <div style="font:14px system-ui,sans-serif; line-height:1.35;">
            <strong>NYC City Council Districts</strong><br/>
            Click a district to see internet access details.
          </div>
        `)
        .openOn(map);
    });
  </script>
</body>
</html>
