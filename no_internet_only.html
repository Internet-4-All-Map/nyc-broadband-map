<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>NYC – Households w/o Internet</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Fullscreen -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.fullscreen@1.6.0/Control.FullScreen.css"/>
  <script src="https://unpkg.com/leaflet.fullscreen@1.6.0/Control.FullScreen.js"></script>

  <style>
    html, body { height: 100%; margin: 0; overflow-x: hidden; }
    #map { position:absolute; inset:0; }

    /* Floating toggle button */
    #togglePanelBtn {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 11000;
      background: #fff;
      border-radius: 50%;
      width: 46px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 10px rgba(0,0,0,.25);
      cursor: pointer;
      font-size: 22px;
    }

    /* OVERLAY PANEL */
    #panel {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 260px;
      background: #fff;
      border-radius: 12px;
      padding: 14px;
      z-index: 10999;
      box-shadow: 0 2px 14px rgba(0,0,0,.22);
      font: 14px system-ui, sans-serif;

      /* Start OPEN now (not collapsed) */
      opacity: 1;                
      transform: scale(1);      
      pointer-events: auto;    
      transition: opacity .2s ease, transform .2s ease;
    }

    #panel.closed {             
      opacity: 0;
      transform: scale(0.7);
      pointer-events: none;
    }

    .sw { display:inline-block;width:18px;height:12px;margin-right:6px;border:1px solid #999; }

    @media (max-width: 768px) {
      #panel { width: 80vw; }
    }
  </style>
</head>

<body>

  <div id="map"></div>

  <!-- Floating settings button -->
  <div id="togglePanelBtn">⚙️</div>

  <!-- Popup overlay panel (OPEN by default now) -->
  <div id="panel">
    <div style="font-weight:700;margin-bottom:6px;">Households w/o Internet (%)</div>

    <label><input id="cbNoNet" type="checkbox" checked> Show layer</label>

    <div style="margin-top:10px;display:flex;justify-content:space-between;">
      <span>Opacity</span><span id="lblNoNet">0.75</span>
    </div>
    <input id="opNoNet" type="range" min="0" max="1" step="0.05" value="0.75"/>

    <div style="margin-top:12px;font-weight:600;">Legend</div>
    <div><span class="sw" style="background:#FDEBD0"></span> 0–5%</div>
    <div><span class="sw" style="background:#FAD7A0"></span> 5–10%</div>
    <div><span class="sw" style="background:#F5B041"></span> 10–15%</div>
    <div><span class="sw" style="background:#DC7633"></span> 15–20%</div>
    <div><span class="sw" style="background:#A04000"></span> 20%+</div>

    <div style="font-size:12px;color:#666;margin-top:10px;">
      Source: ACS 2019–2023
    </div>
  </div>

<script>
  // PANEL TOGGLE ----------------------
  const panel = document.getElementById("panel");
  const btn = document.getElementById("togglePanelBtn");

  btn.addEventListener("click", () => {
    panel.classList.toggle("closed");  
  });

  // MAP --------------------------------
  const PATH = "data/nyc_acs_income_internet_2023_tracts.geojson";
  const FIELD = "pct_no_internet";

  const map = L.map("map", {
    zoomControl: true,
    preferCanvas: true,
    fullscreenControl: true
  }).setView([40.72,-73.96],11);

  L.tileLayer(
    "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
    {
      attribution: '&copy; <a href="https://carto.com/">CARTO</a>',
      subdomains: "abcd",
      maxZoom: 20
    }
  ).addTo(map);

  map.createPane("pane-nointernet");
  map.getPane("pane-nointernet").style.zIndex = 410;

  let layer = null;
  let opacity = 0.75;

  function colorNoInternet(p){
    if(p>=20) return "#A04000";
    if(p>=15) return "#DC7633";
    if(p>=10) return "#F5B041";
    if(p>=5) return "#FAD7A0";
    return "#FDEBD0";
  }

  function style(f){
    const v = f.properties[FIELD];
    return {
      pane:"pane-nointernet",
      color:"#555",
      weight:0.6,
      fill:true,
      fillOpacity:opacity,
      fillColor:colorNoInternet(+v),
      interactive:false
    };
  }

  fetch(PATH)
    .then(r => r.json())
    .then(fc => {
      layer = L.geoJSON(fc, { style }).addTo(map);
      map.fitBounds(layer.getBounds(), { padding:[10,10] });
    });

  // Controls
  const slider = document.getElementById("opNoNet");
  const label = document.getElementById("lblNoNet");

  slider.addEventListener("input", () => {
    opacity = parseFloat(slider.value);
    label.textContent = slider.value;
    if(layer) layer.setStyle({ fillOpacity: opacity });
  });

  document.getElementById("cbNoNet").addEventListener("change", e => {
    if(e.target.checked) map.addLayer(layer);
    else map.removeLayer(layer);
  });
</script>
</body>
</html>
