<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>NYC – Households w/o Internet</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #fff;
    }

    #map {
      position: absolute;
      inset: 0;
      background: #fff;
    }

    /* Floating toggle button (kept, but does nothing unless you add a panel) */
    #togglePanelBtn {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 11000;
      background: #fff;
      border-radius: 50%;
      width: 46px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 10px rgba(0,0,0,.25);
      cursor: pointer;
      font-size: 22px;
      user-select: none;
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <!-- Toggle button -->
  <div id="togglePanelBtn" title="Info">i</div>

  <script>
    /* MAP CONFIG */
    const PATH = "data/nyc_acs_income_internet_2023_tracts.geojson";
    const FIELD = "pct_no_internet";

    const map = L.map("map", {
      zoomControl: true,
      preferCanvas: true,
      attributionControl: false // remove built-in attribution box
    }).setView([40.73, -73.93], 12);

    // Disable scroll zoom (page-friendly)
    map.scrollWheelZoom.disable();
    map.doubleClickZoom.disable();
    map.boxZoom.disable();

    // CartoDB Positron basemap
    L.tileLayer(
      "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
      {
        subdomains: "abcd",
        maxZoom: 20
      }
    ).addTo(map);

    map.createPane("pane-nointernet");
    map.getPane("pane-nointernet").style.zIndex = 410;

    let layer = null;
    let opacity = 1.0;

    function colorNoInternet(p) {
      if (p >= 20) return "#FF0000";
      if (p >= 15) return "#FF6800";
      if (p >= 10) return "#FFA500";
      if (p >= 5)  return "#FFC04C";
      return "#FFDA99";
    }

    function style(f) {
      const v = f.properties[FIELD];
      return {
        pane: "pane-nointernet",
        color: "#555",
        weight: 0.6,
        fill: true,
        fillOpacity: opacity,
        fillColor: colorNoInternet(+v),
        interactive: true 
      };
    }

    function formatPct(v) {
      const n = Number(v);
      return Number.isFinite(n) ? n.toFixed(1) : "N/A";
    }

    function bestTractLabel(p) {
      // Use whatever your GeoJSON actually has. Common candidates:
      // - NAME
      // - tract
      // - GEOID / geoid
      return p.NAME || p.tract || p.GEOID || p.geoid || "Census Tract";
    }

    fetch(PATH)
      .then(r => r.json())
      .then(fc => {
        layer = L.geoJSON(fc, {
          style,
          onEachFeature: (feature, lyr) => {
            const p = feature.properties || {};
            const tractLabel = bestTractLabel(p);
            const pct = p[FIELD];

            // Hover highlight (optional but recommended)
            lyr.on("mouseover", () => {
              lyr.setStyle({ weight: 1.2, color: "#000" });
              // bring to front so borders look crisp
              if (!L.Browser.ie && !L.Browser.opera && !L.Browser.edge) {
                lyr.bringToFront();
              }
            });

            lyr.on("mouseout", () => {
              lyr.setStyle({ weight: 0.6, color: "#555" });
            });

            // Click popup
            lyr.on("click", (e) => {
              const pctTxt = formatPct(pct);

              L.popup({
                closeButton: true,
                offset: [0, -6]
              })
                .setLatLng(e.latlng)
                .setContent(`
                  <div style="font:14px system-ui,sans-serif; line-height:1.25;">
                    <div style="font-weight:700; margin-bottom:6px;">
                      ${tractLabel}
                    </div>
                    <div>
                      <strong>${pctTxt}%</strong> of households<br/>
                      without internet access
                    </div>
                    <div style="margin-top:8px; font-size:12px; color:#666;">
                      Source: ACS 2019–2023
                    </div>
                  </div>
                `)
                .openOn(map);
            });
          }
        }).addTo(map);
      })
      .catch(err => {
        console.error("Failed to load GeoJSON:", err);
      });

    // Button is kept; you can wire it to an info panel later if you want
    const btn = document.getElementById("togglePanelBtn");
    btn.addEventListener("click", () => {
      // simple affordance: show a quick hint
      L.popup({ closeButton: true, offset: [0, -6] })
        .setLatLng(map.getCenter())
        .setContent(`
          <div style="font:14px system-ui,sans-serif">
            Click a tract to see details.
          </div>
        `)
        .openOn(map);
    });
  </script>
</body>
</html>
