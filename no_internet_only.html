<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>NYC – Households w/o Internet</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #fff;
    }

    #map {
      position: absolute;
      inset: 0;
      background: #fff;
    }

    /* Floating toggle button */
    #togglePanelBtn {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 11000;
      background: #fff;
      border-radius: 50%;
      width: 46px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 10px rgba(0,0,0,.25);
      cursor: pointer;
      font-size: 22px;
    }

    /* Overlay panel (never affects layout width) */
    #panel {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 260px;
      background: #fff;
      border-radius: 12px;
      padding: 14px;
      z-index: 10999;
      box-shadow: 0 2px 14px rgba(0,0,0,.22);
      font: 14px system-ui, sans-serif;

      /* OPEN BY DEFAULT */
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
      transition: opacity .2s ease, transform .2s ease;
    }

    #panel.closed {
      opacity: 0;
      transform: scale(0.7);
      pointer-events: none;
    }

    .sw {
      display:inline-block;
      width:18px;
      height:12px;
      margin-right:6px;
      border:1px solid #999;
    }

    @media (max-width: 768px) {
      #panel {
        width: 80vw;
      }
    }
  </style>
</head>

<body>

<div id="map"></div>

<!-- Toggle button -->
<div id="togglePanelBtn"></div>

<!-- Overlay panel -->

  <div style="font-weight:700;margin-bottom:6px;">

<script>
  /* PANEL TOGGLE */
  const panel = document.getElementById("panel");
  const btn = document.getElementById("togglePanelBtn");

  btn.addEventListener("click", () => {
    panel.classList.toggle("closed");
  });

  /* MAP CONFIG */
  const PATH = "data/nyc_acs_income_internet_2023_tracts.geojson";
  const FIELD = "pct_no_internet";

  const map = L.map("map", {
    zoomControl: true,
    preferCanvas: true,
    attributionControl: false   // REMOVE BUILT-IN KEY
  }).setView([40.73, -73.93], 12); // START ZOOMED IN

  // Disable scroll zoom (page-friendly)
  map.scrollWheelZoom.disable();
  map.doubleClickZoom.disable();
  map.boxZoom.disable();

  // CartoDB Positron basemap
  L.tileLayer(
    "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
    {
      subdomains: "abcd",
      maxZoom: 20
    }
  ).addTo(map);

  map.createPane("pane-nointernet");
  map.getPane("pane-nointernet").style.zIndex = 410;

  let layer = null;
  let opacity = 1.0;

  function colorNoInternet(p) {
    if (p >= 20) return "#FF0000";
    if (p >= 15) return "#FF6800";
    if (p >= 10) return "#FFA500";
    if (p >= 5)  return "#FFC04C";
    return "#FFDA99";
  }

  function style(f) {
    const v = f.properties[FIELD];
    return {
      pane: "pane-nointernet",
      color: "#555",
      weight: 0.6,
      fill: true,
      fillOpacity: opacity,
      fillColor: colorNoInternet(+v),
      interactive: false
    };
  }

  fetch(PATH)
    .then(r => r.json())
    .then(fc => {
      layer = L.geoJSON(fc, { style }).addTo(map);
    });

  /* CONTROLS */
  const slider = document.getElementById("opNoNet");
  const label = document.getElementById("lblNoNet");

  slider.addEventListener("input", () => {
    opacity = parseFloat(slider.value);
    label.textContent = slider.value;
    if (layer) layer.setStyle({ fillOpacity: opacity });
  });

  document.getElementById("cbNoNet").addEventListener("change", e => {
    if (e.target.checked) map.addLayer(layer);
    else map.removeLayer(layer);
  });
</script>

</body>
</html>
