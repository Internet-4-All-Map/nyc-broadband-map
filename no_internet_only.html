<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NYC – Households w/o Internet</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
    }

    #map {
      position: absolute;
      inset: 0;
    }

    /* simple side panel */
    #panel {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 9999;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 14px rgba(0,0,0,.18);
      padding: 14px 14px 10px;
      max-width: 260px;
      font: 14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }

    #panel .hdr {
      font-weight: 700;
      margin-bottom: 8px;
    }

    #panel .row {
      margin-bottom: 10px;
    }

    #panel .lab {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    #panel input[type="range"] {
      width: 100%;
    }

    #panel hr {
      border: none;
      border-top: 1px solid #eee;
      margin: 10px 0;
    }

    .sw {
      display: inline-block;
      width: 18px;
      height: 12px;
      margin-right: 6px;
      border: 1px solid #999;
      vertical-align: middle;
    }

    #status {
      position: absolute;
      left: 12px;
      bottom: 12px;
      z-index: 9999;
      background: #111;
      color: #fff;
      padding: 6px 8px;
      border-radius: 6px;
      opacity: .9;
      font: 12px/1.3 system-ui, Arial;
      max-width: 50vw;
    }

    @media (max-width: 768px) {
      #panel {
        max-width: 88vw;
        right: 8px;
        left: 8px;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <div id="panel">
    <div class="hdr">Households w/o Internet (%)</div>

    <div class="row">
      <div class="lab">
        <label><input id="cbNoNet" type="checkbox" checked> Show layer</label>
        <span id="lblNoNet">0.75</span>
      </div>
      <input id="opNoNet" type="range" min="0" max="1" step="0.05" value="0.75" />
    </div>

    <hr>

    <div id="legendNoNet">
      <div style="font-weight:600;margin-bottom:4px">Legend</div>
      <div><span class="sw" style="background:#FDEBD0"></span> 0–5%</div>
      <div><span class="sw" style="background:#FAD7A0"></span> 5–10%</div>
      <div><span class="sw" style="background:#F5B041"></span> 10–15%</div>
      <div><span class="sw" style="background:#DC7633"></span> 15–20%</div>
      <div><span class="sw" style="background:#A04000"></span> 20%+</div>
      <div><span class="sw"
        style="background:repeating-linear-gradient(45deg,#000,#000 4px,#fff 4px,#fff 8px)"></span>
        No data
      </div>
    </div>

    <hr>

    <div style="font-size:12px;color:#666">
      Source: ACS 2019–2023. CRS: EPSG:4326.
    </div>
  </div>

  <div id="status">Loading…</div>

  <script>
    // ---- CONFIG (reuses your existing GeoJSON + field name) ----
    const PATHS = {
      tracts: 'data/nyc_acs_income_internet_2023_tracts.geojson'
    };

    const FIELDS = {
      noInternetPct: 'pct_no_internet',
      tractName: 'NAME',
      hhTotal: 'households_total'
    };

    const statusEl = document.getElementById('status');
    function setStatus(msg) { statusEl.textContent = msg; }

    // ---- Map ----
    const map = L.map('map', {
      zoomControl: true,
      preferCanvas: true
    }).setView([40.72, -73.96], 11);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 20,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    L.control.scale({ imperial: false }).addTo(map);

    map.createPane('pane-nointernet');
    map.getPane('pane-nointernet').style.zIndex = 410;

    let currentOpacity = 0.75;
    let noInternetLayer = null;
    let tractsFC = null;

    const isNoData = (v) =>
      v === null || v === undefined || v === '' || Number(v) === -666666666;

    function colorNoInternet(pct) {
      if (pct >= 20) return '#A04000';
      if (pct >= 15) return '#DC7633';
      if (pct >= 10) return '#F5B041';
      if (pct >= 5)  return '#FAD7A0';
      return '#FDEBD0';
    }

    function styleNoInternet(f) {
      const v = f.properties[FIELDS.noInternetPct];
      return {
        pane: 'pane-nointernet',
        color: '#555',
        weight: 0.6,
        opacity: 1,
        fill: true,
        fillOpacity: currentOpacity,
        fillColor: isNoData(v) ? '#ffffff' : colorNoInternet(+v),
        interactive: false,
        smoothFactor: 0.2
      };
    }

    async function loadJSON(path) {
      const r = await fetch(path);
      if (!r.ok) throw new Error(`${path}: ${r.status} ${r.statusText}`);
      return await r.json();
    }

    (async function init() {
      try {
        setStatus('Loading data…');
        const tracts = await loadJSON(PATHS.tracts);
        tractsFC = tracts;

        noInternetLayer = L.geoJSON(tractsFC, {
          style: styleNoInternet,
          pane: 'pane-nointernet'
        }).addTo(map);

        try {
          map.fitBounds(noInternetLayer.getBounds(), { padding: [10, 10] });
        } catch (e) {}

        setStatus('Loaded.');

        // --- Slider binding ---
        const opInput = document.getElementById('opNoNet');
        const opLabel = document.getElementById('lblNoNet');

        function updateOpacityFromSlider() {
          currentOpacity = parseFloat(opInput.value);
          opLabel.textContent = opInput.value;
          if (noInternetLayer) {
            noInternetLayer.setStyle({ fillOpacity: currentOpacity });
          }
        }

        opInput.addEventListener('input', updateOpacityFromSlider);
        updateOpacityFromSlider(); // initial

        // --- Checkbox show/hide ---
        const cbNoNet = document.getElementById('cbNoNet');
        cbNoNet.addEventListener('change', (e) => {
          if (e.target.checked) {
            map.addLayer(noInternetLayer);
          } else {
            map.removeLayer(noInternetLayer);
          }
        });

      } catch (err) {
        console.error(err);
        setStatus(
          'Error: ' +
          err.message +
          ' — check that data/nyc_acs_income_internet_2023_tracts.geojson exists and is valid GeoJSON (EPSG:4326).'
        );
      }
    })();
  </script>
</body>
</html>
