<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NYC City Council Districts – Internet Access</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css"
  />

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: system-ui, sans-serif;
      background: #fff;
    }

    #map {
      position: absolute;
      inset: 0;
      background: #fff;
    }

    .legend-box {
      background: rgba(255, 255, 255, 0.96);
      padding: 10px 12px;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.18);
      line-height: 1.3;
      min-width: 180px;
    }

    .legend-title {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      margin-bottom: 5px;
      font-size: 12px;
    }

    .legend-swatch {
      width: 16px;
      height: 16px;
      margin-right: 8px;
      border: 1px solid #bdbdbd;
      box-sizing: border-box;
      flex: 0 0 16px;
    }

    .leaflet-popup-content {
      margin: 12px 14px;
    }

    .popup-title {
      font-weight: 700;
      margin-bottom: 6px;
      font-size: 14px;
    }

    .popup-row {
      margin-bottom: 4px;
      font-size: 13px;
    }

    .popup-source {
      margin-top: 8px;
      font-size: 11px;
      color: #666;
      line-height: 1.35;
    }

    .leaflet-control-geocoder {
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.18);
      border: none;
    }

    .leaflet-control-geocoder-form input {
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <script>
    const PATH = "data/nyc_council_districts_enriched.geojson";
    const FIELD = "no_internet_pct";

    const map = L.map("map", {
      zoomControl: true,
      preferCanvas: true,
      attributionControl: false
    }).setView([40.73, -73.93], 10);

    L.tileLayer(
      "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
      {
        subdomains: "abcd",
        maxZoom: 20
      }
    ).addTo(map);

    let districtLayer = null;
    let searchMarker = null;
    let selectedDistrictLayer = null;

    function colorNoInternet(p) {
      if (p >= 25) return "#b10026";
      if (p >= 20) return "#e31a1c";
      if (p >= 15) return "#fc4e2a";
      if (p >= 10) return "#fd8d3c";
      if (p >= 5) return "#feb24c";
      return "#fed976";
    }

    function getDistrictStyle(feature) {
      const v = Number(feature.properties?.[FIELD]);
      return {
        color: "#555",
        weight: 1,
        opacity: 1,
        fillColor: colorNoInternet(v),
        fillOpacity: 0.82
      };
    }

    function getHoverStyle(feature) {
      const v = Number(feature.properties?.[FIELD]);
      return {
        color: "#111",
        weight: 2,
        opacity: 1,
        fillColor: colorNoInternet(v),
        fillOpacity: 0.92
      };
    }

    function getSelectedStyle(feature) {
      const v = Number(feature.properties?.[FIELD]);
      return {
        color: "#111",
        weight: 3,
        opacity: 1,
        fillColor: colorNoInternet(v),
        fillOpacity: 0.95
      };
    }

    function formatPct(v) {
      const n = Number(v);
      return Number.isFinite(n) ? `${n.toFixed(1)}%` : "N/A";
    }

    function districtLabel(props) {
      const district = props?.district_num ?? "N/A";
      const borough = props?.Borough ? `, ${props.Borough}` : "";
      return `Council District ${district}${borough}`;
    }

    function buildPopupContent(props, titleOverride) {
      return `
        <div>
          <div class="popup-title">${titleOverride || districtLabel(props)}</div>
          <div class="popup-row"><strong>Member:</strong> ${props.Member ?? "N/A"}</div>
          <div class="popup-row"><strong>Party:</strong> ${props.Party ?? "N/A"}</div>
          <div class="popup-row"><strong>No internet:</strong> ${formatPct(props.no_internet_pct)}</div>
          <div class="popup-row"><strong>Tier:</strong> ${props.no_internet_tier ?? "N/A"}</div>
          <div class="popup-source">${props._internet_source ?? ""}</div>
        </div>
      `;
    }

    function clearSelectedDistrict() {
      if (selectedDistrictLayer) {
        districtLayer.resetStyle(selectedDistrictLayer);
        selectedDistrictLayer = null;
      }
    }

    function setSelectedDistrict(layer) {
      clearSelectedDistrict();
      selectedDistrictLayer = layer;
      selectedDistrictLayer.setStyle(getSelectedStyle(selectedDistrictLayer.feature));
      if (!L.Browser.ie && !L.Browser.opera && !L.Browser.edge) {
        selectedDistrictLayer.bringToFront();
      }
    }

    function pointInLayer(latlng) {
      let matchedLayer = null;

      districtLayer.eachLayer(function (layer) {
        if (matchedLayer) return;

        const geom = layer.feature?.geometry;
        if (!geom) return;

        if (isLatLngInsideGeometry(latlng, geom)) {
          matchedLayer = layer;
        }
      });

      return matchedLayer;
    }

    function isLatLngInsideGeometry(latlng, geometry) {
      const x = latlng.lng;
      const y = latlng.lat;

      if (geometry.type === "Polygon") {
        return polygonContainsPoint(geometry.coordinates, x, y);
      }

      if (geometry.type === "MultiPolygon") {
        return geometry.coordinates.some(poly => polygonContainsPoint(poly, x, y));
      }

      return false;
    }

    function polygonContainsPoint(rings, x, y) {
      if (!rings || !rings.length) return false;

      const inOuter = pointInRing(rings[0], x, y);
      if (!inOuter) return false;

      for (let i = 1; i < rings.length; i++) {
        if (pointInRing(rings[i], x, y)) return false;
      }

      return true;
    }

    function pointInRing(ring, x, y) {
      let inside = false;

      for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        const xi = ring[i][0];
        const yi = ring[i][1];
        const xj = ring[j][0];
        const yj = ring[j][1];

        const intersect =
          ((yi > y) !== (yj > y)) &&
          (x < ((xj - xi) * (y - yi)) / ((yj - yi) || 1e-12) + xi);

        if (intersect) inside = !inside;
      }

      return inside;
    }

    fetch(PATH)
      .then(response => response.json())
      .then(fc => {
        districtLayer = L.geoJSON(fc, {
          style: getDistrictStyle,
          onEachFeature: (feature, layer) => {
            const props = feature.properties || {};

            layer.on("mouseover", () => {
              if (layer !== selectedDistrictLayer) {
                layer.setStyle(getHoverStyle(feature));
              }
              if (!L.Browser.ie && !L.Browser.opera && !L.Browser.edge) {
                layer.bringToFront();
              }
            });

            layer.on("mouseout", () => {
              if (layer === selectedDistrictLayer) {
                layer.setStyle(getSelectedStyle(feature));
              } else {
                districtLayer.resetStyle(layer);
              }
            });

            layer.on("click", e => {
              setSelectedDistrict(layer);

              L.popup({ maxWidth: 320 })
                .setLatLng(e.latlng)
                .setContent(buildPopupContent(props))
                .openOn(map);
            });
          }
        }).addTo(map);

        map.fitBounds(districtLayer.getBounds(), { padding: [20, 20] });
      })
      .catch(err => {
        console.error("Failed to load GeoJSON:", err);
      });

    const geocoder = L.Control.geocoder({
      defaultMarkGeocode: false,
      position: "topleft",
      placeholder: "Search NYC address...",
      errorMessage: "Address not found"
    })
      .on("markgeocode", function (e) {
        const center = e.geocode.center;

        map.setView(center, 15);

        if (searchMarker) {
          map.removeLayer(searchMarker);
        }

        searchMarker = L.marker(center).addTo(map);

        const matchedLayer = districtLayer ? pointInLayer(center) : null;
        const matchedProps = matchedLayer?.feature?.properties || null;

        if (matchedLayer) {
          setSelectedDistrict(matchedLayer);
        } else {
          clearSelectedDistrict();
        }

        const popupHtml = matchedProps
          ? `
            <div>
              <div class="popup-title">${e.geocode.name}</div>
              <div class="popup-row"><strong>District:</strong> ${matchedProps.district_num ?? "N/A"}</div>
              <div class="popup-row"><strong>Member:</strong> ${matchedProps.Member ?? "N/A"}</div>
              <div class="popup-row"><strong>Borough:</strong> ${matchedProps.Borough ?? "N/A"}</div>
              <div class="popup-row"><strong>No internet:</strong> ${formatPct(matchedProps.no_internet_pct)}</div>
              <div class="popup-row"><strong>Tier:</strong> ${matchedProps.no_internet_tier ?? "N/A"}</div>
            </div>
          `
          : `
            <div>
              <div class="popup-title">${e.geocode.name}</div>
              <div class="popup-row">Address found, but no district match was detected.</div>
            </div>
          `;

        searchMarker.bindPopup(popupHtml).openPopup();
      })
      .addTo(map);

    const legend = L.control({ position: "bottomright" });

    legend.onAdd = function () {
      const div = L.DomUtil.create("div", "legend-box");

      const ranges = [
        { label: "< 5%", color: colorNoInternet(0) },
        { label: "5% – < 10%", color: colorNoInternet(6) },
        { label: "10% – < 15%", color: colorNoInternet(11) },
        { label: "15% – < 20%", color: colorNoInternet(16) },
        { label: "20% – < 25%", color: colorNoInternet(21) },
        { label: "25%+", color: colorNoInternet(26) }
      ];

      div.innerHTML = `
        <div class="legend-title">No Internet (%)</div>
        ${ranges.map(item => `
          <div class="legend-item">
            <span class="legend-swatch" style="background:${item.color};"></span>
            <span>${item.label}</span>
          </div>
        `).join("")}
      `;

      return div;
    };

    legend.addTo(map);
  </script>
</body>
</html>
