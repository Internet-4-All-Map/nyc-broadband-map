<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>NYC City Council Districts – Internet Access</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css"/>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #fff;
      font-family: system-ui, sans-serif;
    }

    #map {
      position: absolute;
      inset: 0;
      background: #fff;
    }

    #togglePanelBtn {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 11000;
      background: #fff;
      border-radius: 50%;
      width: 46px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 10px rgba(0,0,0,.25);
      cursor: pointer;
      font-size: 22px;
      user-select: none;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="togglePanelBtn" title="Info">i</div>

  <script>
    const PATH = "data/nyc_council_districts_enriched.geojson";
    const FIELD = "no_internet_pct";

    const map = L.map("map", {
      zoomControl: true,
      preferCanvas: true,
      attributionControl: false
    }).setView([40.73, -73.93], 10);

    L.tileLayer(
      "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
      {
        subdomains: "abcd",
        maxZoom: 20
      }
    ).addTo(map);

    let searchMarker = null;
    let layer = null;
    let opacity = 0.85;

    function colorNoInternet(p) {
      if (p >= 25) return "#b10026";
      if (p >= 20) return "#e31a1c";
      if (p >= 15) return "#fc4e2a";
      if (p >= 10) return "#fd8d3c";
      if (p >= 5)  return "#feb24c";
      return "#fed976";
    }

    function style(feature) {
      const v = Number(feature.properties?.[FIELD]);
      return {
        color: "#444",
        weight: 1,
        fill: true,
        fillOpacity: opacity,
        fillColor: colorNoInternet(v),
        interactive: true
      };
    }

    function formatPct(v) {
      const n = Number(v);
      return Number.isFinite(n) ? n.toFixed(1) : "N/A";
    }

    function districtLabel(props) {
      const district = props.district_num ?? "N/A";
      const borough = props.Borough ?? "";
      return `Council District ${district}${borough ? `, ${borough}` : ""}`;
    }

    function pointInLayer(latlng) {
      let matchedFeature = null;

      layer.eachLayer(function (districtLayer) {
        if (matchedFeature) return;

        const geom = districtLayer.feature?.geometry;
        if (!geom) return;

        if (isLatLngInsideGeometry(latlng, geom)) {
          matchedFeature = districtLayer.feature;
        }
      });

      return matchedFeature;
    }

    function isLatLngInsideGeometry(latlng, geometry) {
      const x = latlng.lng;
      const y = latlng.lat;

      if (geometry.type === "Polygon") {
        return polygonContainsPoint(geometry.coordinates, x, y);
      }

      if (geometry.type === "MultiPolygon") {
        return geometry.coordinates.some(poly => polygonContainsPoint(poly, x, y));
      }

      return false;
    }

    function polygonContainsPoint(rings, x, y) {
      if (!rings || !rings.length) return false;

      const insideOuter = pointInRing(rings[0], x, y);
      if (!insideOuter) return false;

      for (let i = 1; i < rings.length; i++) {
        if (pointInRing(rings[i], x, y)) return false;
      }

      return true;
    }

    function pointInRing(ring, x, y) {
      let inside = false;

      for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        const xi = ring[i][0], yi = ring[i][1];
        const xj = ring[j][0], yj = ring[j][1];

        const intersect =
          ((yi > y) !== (yj > y)) &&
          (x < (xj - xi) * (y - yi) / ((yj - yi) || 1e-12) + xi);

        if (intersect) inside = !inside;
      }

      return inside;
    }

    fetch(PATH)
      .then(r => r.json())
      .then(fc => {
        layer = L.geoJSON(fc, {
          style,
          onEachFeature: (feature, lyr) => {
            const p = feature.properties || {};

            lyr.on("mouseover", () => {
              lyr.setStyle({ weight: 2, color: "#111" });
              if (!L.Browser.ie && !L.Browser.opera && !L.Browser.edge) {
                lyr.bringToFront();
              }
            });

            lyr.on("mouseout", () => {
              lyr.setStyle({ weight: 1, color: "#444" });
            });

            lyr.on("click", (e) => {
              L.popup({ maxWidth: 320 })
                .setLatLng(e.latlng)
                .setContent(`
                  <div style="font:14px system-ui,sans-serif; line-height:1.35;">
                    <div style="font-weight:700; margin-bottom:6px;">
                      ${districtLabel(p)}
                    </div>
                    <div><strong>Member:</strong> ${p.Member ?? "N/A"}</div>
                    <div><strong>Party:</strong> ${p.Party ?? "N/A"}</div>
                    <div><strong>No internet:</strong> ${formatPct(p.no_internet_pct)}%</div>
                    <div><strong>Tier:</strong> ${p.no_internet_tier ?? "N/A"}</div>
                    <div style="margin-top:8px; font-size:12px; color:#666;">
                      ${p._internet_source ?? ""}
                    </div>
                  </div>
                `)
                .openOn(map);
            });
          }
        }).addTo(map);

        map.fitBounds(layer.getBounds(), { padding: [20, 20] });
      });

    // ADDRESS SEARCH
    const geocoder = L.Control.geocoder({
      defaultMarkGeocode: false,
      placeholder: "Search NYC address...",
      errorMessage: "Address not found"
    })
    .on("markgeocode", function(e) {
      const center = e.geocode.center;

      map.setView(center, 15);

      if (searchMarker) {
        map.removeLayer(searchMarker);
      }

      searchMarker = L.marker(center).addTo(map);

      const matched = layer ? pointInLayer(center) : null;
      const props = matched?.properties;

      searchMarker.bindPopup(`
        <div style="font:14px system-ui,sans-serif; line-height:1.35;">
          <div style="font-weight:700; margin-bottom:6px;">${e.geocode.name}</div>
          ${
            props
              ? `
                <div><strong>District:</strong> ${props.district_num ?? "N/A"}</div>
                <div><strong>Member:</strong> ${props.Member ?? "N/A"}</div>
                <div><strong>Borough:</strong> ${props.Borough ?? "N/A"}</div>
                <div><strong>No internet:</strong> ${formatPct(props.no_internet_pct)}%</div>
                <div><strong>Tier:</strong> ${props.no_internet_tier ?? "N/A"}</div>
              `
              : `<div>Address found, but no matching district polygon was detected.</div>`
          }
        </div>
      `).openPopup();
    })
    .addTo(map);

    document.getElementById("togglePanelBtn").addEventListener("click", () => {
      L.popup()
        .setLatLng(map.getCenter())
        .setContent(`
          <div style="font:14px system-ui,sans-serif; line-height:1.35;">
            <strong>NYC City Council Districts</strong><br/>
            Search an address or click a district.
          </div>
        `)
        .openOn(map);
    });
  </script>
</body>
</html>
